<!-- Osaka's parts, posed by `art.rs`, after the character sheet in
     docs/ayumu.webp: long straight dark-brown hair with ragged bangs,
     very large round eyes, the winter uniform (salmon top, white sailor
     collar with red trim, thin red cord with a yellow toggle, maroon
     pleated skirt, white knee socks, brown loafers).

     Canvas 100 x 160; feet rest on y = 158. Each part is a symbol drawn
     at its pivot; `art.rs` places them with rotate/translate. Outlines
     use currentColor; interior detail is dark so it reads on the fills.
     The long hair is split: `*hair-back` sits behind her body, the face
     and bangs in front of it. -->
<defs>
  <!-- Frontal. Face around (50, 46); neck pivot (50, 70). -->
  <g id="hair-back">
    <path d="M 22 44 C 19 18 35 5 50 5 C 65 5 81 18 78 44 L 80 106 L 75 101
             L 71 109 L 67 100 L 33 100 L 29 109 L 25 101 L 20 106 Z"
          fill="#4a3326" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g id="face">
    <path d="M 28 40 C 28 57 38 68 50 68 C 62 68 72 57 72 40
             C 72 30 62 25 50 25 C 38 25 28 30 28 40 Z"
          fill="#f6dccb" stroke="currentColor" stroke-width="2"/>
  </g>
  <g id="hair-front">
    <path d="M 24 47 C 23 21 36 8 50 8 C 64 8 77 21 76 47 L 73 47 L 71.5 31
             L 67.5 41 L 64 28.5 L 59 39 L 53 27 L 49.5 27 L 44 39.5 L 39 28.5
             L 35 41 L 31 31 L 28 47 Z"
          fill="#553a2b" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 25 44 C 23 60 25 74 30 86 L 32 70 C 30 60 30 52 30 44 Z"
          fill="#553a2b" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 75 44 C 77 60 75 74 70 86 L 68 70 C 70 60 70 52 70 44 Z"
          fill="#553a2b" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  </g>

  <!-- Eyes: big, round, wide open; brown irises with highlights. -->
  <g id="eyes-open">
    <ellipse cx="39.5" cy="47" rx="6.3" ry="7.6" fill="#ffffff" stroke="#2b1d18" stroke-width="1.2"/>
    <ellipse cx="60.5" cy="47" rx="6.3" ry="7.6" fill="#ffffff" stroke="#2b1d18" stroke-width="1.2"/>
    <ellipse cx="40" cy="48.3" rx="4.7" ry="5.9" fill="#6b4128"/>
    <ellipse cx="60" cy="48.3" rx="4.7" ry="5.9" fill="#6b4128"/>
    <ellipse cx="40" cy="48.8" rx="2.4" ry="3.2" fill="#24150e"/>
    <ellipse cx="60" cy="48.8" rx="2.4" ry="3.2" fill="#24150e"/>
    <circle cx="41.8" cy="45.8" r="1.6" fill="#ffffff"/>
    <circle cx="61.8" cy="45.8" r="1.6" fill="#ffffff"/>
    <circle cx="38.6" cy="51" r="0.8" fill="#ffffff"/>
    <circle cx="58.6" cy="51" r="0.8" fill="#ffffff"/>
    <path d="M 32.8 42.5 Q 39.5 37.8 46.2 42.5" fill="none" stroke="#2b1d18" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 53.8 42.5 Q 60.5 37.8 67.2 42.5" fill="none" stroke="#2b1d18" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <!-- Her default: the wide-eyed blank look, a tiny mouth. -->
  <g id="face-vacant">
    <use href="#eyes-open"/>
    <path d="M 48.8 60.6 L 51.2 60.6" fill="none" stroke="#2b1d18" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g id="face-blink">
    <path d="M 33.5 48 Q 39.5 51.5 45.5 48" fill="none" stroke="#2b1d18" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 54.5 48 Q 60.5 51.5 66.5 48" fill="none" stroke="#2b1d18" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 48.8 60.6 L 51.2 60.6" fill="none" stroke="#2b1d18" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g id="face-surprised">
    <ellipse cx="39.5" cy="47" rx="6.5" ry="7.9" fill="#ffffff" stroke="#2b1d18" stroke-width="1.3"/>
    <ellipse cx="60.5" cy="47" rx="6.5" ry="7.9" fill="#ffffff" stroke="#2b1d18" stroke-width="1.3"/>
    <circle cx="40" cy="47.5" r="2.4" fill="#6b4128"/>
    <circle cx="60" cy="47.5" r="2.4" fill="#6b4128"/>
    <circle cx="40" cy="47.5" r="1.2" fill="#24150e"/>
    <circle cx="60" cy="47.5" r="1.2" fill="#24150e"/>
    <ellipse cx="50" cy="61" rx="2.2" ry="2.8" fill="#9b3b3b" stroke="#2b1d18" stroke-width="1.1"/>
  </g>
  <!-- The goodbye smile: eyes creased happy, mouth open. -->
  <g id="face-smile">
    <path d="M 34 49.5 Q 39.5 42.5 45 49.5" fill="none" stroke="#2b1d18" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M 55 49.5 Q 60.5 42.5 66 49.5" fill="none" stroke="#2b1d18" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M 43.5 57.5 Q 50 67 56.5 57.5 Z" fill="#b8474a" stroke="#2b1d18" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <!-- Delighted: big eyes and a big open smile. -->
  <g id="face-happy">
    <use href="#eyes-open"/>
    <path d="M 43.5 57.5 Q 50 67 56.5 57.5 Z" fill="#b8474a" stroke="#2b1d18" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <!-- Curious: looking up at something, a small "o". -->
  <g id="face-curious">
    <ellipse cx="39.5" cy="47" rx="6.3" ry="7.6" fill="#ffffff" stroke="#2b1d18" stroke-width="1.2"/>
    <ellipse cx="60.5" cy="47" rx="6.3" ry="7.6" fill="#ffffff" stroke="#2b1d18" stroke-width="1.2"/>
    <ellipse cx="40.5" cy="45" rx="4.4" ry="5.2" fill="#6b4128"/>
    <ellipse cx="60.5" cy="45" rx="4.4" ry="5.2" fill="#6b4128"/>
    <ellipse cx="40.5" cy="45" rx="2.2" ry="2.8" fill="#24150e"/>
    <ellipse cx="60.5" cy="45" rx="2.2" ry="2.8" fill="#24150e"/>
    <circle cx="42" cy="43" r="1.4" fill="#ffffff"/>
    <circle cx="62" cy="43" r="1.4" fill="#ffffff"/>
    <path d="M 32.8 41 Q 39.5 36 46.2 41" fill="none" stroke="#2b1d18" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 53.8 41 Q 60.5 36 67.2 41" fill="none" stroke="#2b1d18" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="50" cy="61" rx="1.6" ry="1.9" fill="#9b3b3b" stroke="#2b1d18" stroke-width="1"/>
  </g>
  <g id="face-dizzy">
    <path d="M 39.5 47 m -5 0 a 5 5 0 1 0 10 0 a 3.6 3.6 0 1 0 -7.2 0 a 2 2 0 1 0 4 0"
          fill="none" stroke="#2b1d18" stroke-width="1.5"/>
    <path d="M 60.5 47 m -5 0 a 5 5 0 1 0 10 0 a 3.6 3.6 0 1 0 -7.2 0 a 2 2 0 1 0 4 0"
          fill="none" stroke="#2b1d18" stroke-width="1.5"/>
    <path d="M 45.5 60 Q 47.8 58 50 60 Q 52.2 62 54.5 60" fill="none" stroke="#2b1d18" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Winter uniform: salmon top, white sailor collar with red trim, a
       thin red cord with a yellow toggle. -->
  <g id="torso">
    <rect x="46.5" y="64" width="7" height="9" fill="#f6dccb" stroke="currentColor" stroke-width="1.4"/>
    <path d="M 36 72 C 41 70 59 70 64 72 L 67 104 L 33 104 Z"
          fill="#e07f7a" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 36 72 C 41 70 59 70 64 72 L 67 79 L 60 83 L 50 91 L 40 83 L 33 79 Z"
          fill="#f7f4f0" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M 34.6 78 L 40.6 81.6 L 50 88.6 L 59.4 81.6 L 65.4 78" fill="none" stroke="#c9453f" stroke-width="1.1"/>
    <path d="M 44.5 71.5 L 50 80 L 55.5 71.5 Z" fill="#e07f7a" stroke="currentColor" stroke-width="1"/>
    <path d="M 50 88 L 49.4 101" fill="none" stroke="#8e2b2b" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="48.4" y="86.5" width="3.2" height="4" rx="0.6" fill="#e8c34a" stroke="#6b5313" stroke-width="0.7"/>
  </g>
  <g id="skirt">
    <path d="M 33 102 L 67 102 L 73 126 L 27 126 Z"
          fill="#823f49" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 39 103 L 35.5 125.5 M 45 103 L 43.5 125.5 M 50 103 L 50 125.5 M 55 103 L 56.5 125.5 M 61 103 L 64.5 125.5"
          fill="none" stroke="#5a2830" stroke-width="1.1"/>
  </g>

  <!-- Limbs, drawn hanging straight down from a pivot at (0, 0). -->
  <g id="arm-upper">
    <rect x="-3.6" y="-1" width="7.2" height="15" rx="3.2" fill="#e07f7a" stroke="currentColor" stroke-width="1.6"/>
  </g>
  <g id="arm-lower">
    <rect x="-3" y="-1" width="6" height="11" rx="2.6" fill="#e07f7a" stroke="currentColor" stroke-width="1.4"/>
    <rect x="-3.1" y="8" width="6.2" height="3" fill="#f7f4f0" stroke="#c9453f" stroke-width="0.8"/>
    <circle cx="0" cy="13.2" r="2.8" fill="#f6dccb" stroke="currentColor" stroke-width="1.4"/>
  </g>
  <g id="leg-upper">
    <rect x="-2.8" y="-1" width="5.6" height="19" rx="2.5" fill="#f6dccb" stroke="currentColor" stroke-width="1.5"/>
  </g>
  <g id="leg-lower">
    <rect x="-2.7" y="-1" width="5.4" height="16" rx="2.3" fill="#f7f4f0" stroke="currentColor" stroke-width="1.5"/>
    <ellipse cx="1.8" cy="16.2" rx="4.6" ry="2.5" fill="#6b3a24" stroke="currentColor" stroke-width="1.2"/>
  </g>

  <!-- Profile (facing right). Skull around (52, 38); the long hair hangs
       down her back; the collar's square flap lies on her back. -->
  <g id="p-hair-back">
    <path d="M 76 24 C 68 6 42 4 30 17 C 20 30 19 62 21 104 L 27 99 L 31 108
             L 36 100 L 41 106 L 45 64 L 50 46 Z"
          fill="#4a3326" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g id="p-face">
    <path d="M 48 30 C 60 25 75 28 78 40 L 80.5 47 L 77.5 48.5 C 78.5 55 76 61 71 65
             C 66 69 58 70 53 67 C 49 64 47 58 47 52 Z"
          fill="#f6dccb" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g id="p-hair-front">
    <path d="M 44 26 C 52 10 72 10 79 25 L 80 38 L 76.5 32 L 74 40 L 70.5 31 L 67 39
             L 63 30.5 L 59 37 L 55 30 L 50 36 Z"
          fill="#553a2b" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 49 34 C 45 50 46 66 52 80 L 55 64 C 53 54 53 44 55 34 Z"
          fill="#553a2b" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <g id="p-eye-open">
    <path d="M 63.5 42.8 C 66.5 40.5 71 40.5 73.5 43.5 L 73.5 50.5 C 70.5 53 66.5 52.8 64 49.8 Z"
          fill="#ffffff" stroke="#2b1d18" stroke-width="1"/>
    <ellipse cx="70.2" cy="47.3" rx="3" ry="4.3" fill="#6b4128"/>
    <ellipse cx="70.6" cy="47.8" rx="1.6" ry="2.4" fill="#24150e"/>
    <circle cx="71.3" cy="45.4" r="1.1" fill="#ffffff"/>
    <path d="M 62.8 43 C 66 40 71 39.8 74 42.8" fill="none" stroke="#2b1d18" stroke-width="2.1" stroke-linecap="round"/>
  </g>
  <g id="p-face-vacant">
    <use href="#p-eye-open"/>
    <path d="M 72 59.2 L 74.8 59" fill="none" stroke="#2b1d18" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <g id="p-face-blink">
    <path d="M 64 47.5 Q 68.8 50 73.5 47.3" fill="none" stroke="#2b1d18" stroke-width="2" stroke-linecap="round"/>
    <path d="M 72 59.2 L 74.8 59" fill="none" stroke="#2b1d18" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <g id="p-face-surprised">
    <path d="M 63.5 42.3 C 66.5 39.8 71 39.8 73.8 43 L 73.8 51 C 70.5 53.6 66.5 53.4 64 50.2 Z"
          fill="#ffffff" stroke="#2b1d18" stroke-width="1.1"/>
    <circle cx="70.3" cy="47" r="1.9" fill="#6b4128"/>
    <circle cx="70.3" cy="47" r="0.9" fill="#24150e"/>
    <ellipse cx="74.2" cy="59.5" rx="1.7" ry="2.2" fill="#9b3b3b" stroke="#2b1d18" stroke-width="1"/>
  </g>
  <g id="p-face-smile">
    <path d="M 64 48.3 Q 68.8 42.6 73.5 48" fill="none" stroke="#2b1d18" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M 70.5 57 Q 73 62.5 77 57.5 Z" fill="#b8474a" stroke="#2b1d18" stroke-width="1.1" stroke-linejoin="round"/>
  </g>
  <g id="p-face-happy">
    <use href="#p-eye-open"/>
    <path d="M 70.5 57 Q 73 62.5 77 57.5 Z" fill="#b8474a" stroke="#2b1d18" stroke-width="1.1" stroke-linejoin="round"/>
  </g>
  <g id="p-face-curious">
    <path d="M 63.5 42.8 C 66.5 40.5 71 40.5 73.5 43.5 L 73.5 50.5 C 70.5 53 66.5 52.8 64 49.8 Z"
          fill="#ffffff" stroke="#2b1d18" stroke-width="1"/>
    <ellipse cx="71" cy="45.3" rx="2.8" ry="3.8" fill="#6b4128"/>
    <ellipse cx="71.3" cy="45.3" rx="1.5" ry="2.1" fill="#24150e"/>
    <circle cx="72" cy="43.8" r="1" fill="#ffffff"/>
    <path d="M 62.8 42 C 66 39 71 38.8 74 41.8" fill="none" stroke="#2b1d18" stroke-width="2.1" stroke-linecap="round"/>
    <ellipse cx="74" cy="59.4" rx="1.3" ry="1.6" fill="#9b3b3b" stroke="#2b1d18" stroke-width="0.9"/>
  </g>
  <g id="p-face-dizzy">
    <path d="M 68.5 46 m -3.8 0 a 3.8 3.8 0 1 0 7.6 0 a 2.7 2.7 0 1 0 -5.4 0 a 1.5 1.5 0 1 0 3 0"
          fill="none" stroke="#2b1d18" stroke-width="1.4"/>
    <path d="M 70 59 Q 72 57.5 74 59 Q 75.5 60.2 76.5 59" fill="none" stroke="#2b1d18" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <g id="p-torso">
    <rect x="47" y="63" width="6.5" height="10" fill="#f6dccb" stroke="currentColor" stroke-width="1.4"/>
    <path d="M 41 72 C 45 70 55 70 59 72 C 61.5 80 62 92 63 104 L 39 104 C 39.5 92 39.5 80 41 72 Z"
          fill="#e07f7a" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 41 71.5 L 50 71.5 L 50 86 L 38.5 86 C 38.8 80 39.5 75 41 71.5 Z"
          fill="#f7f4f0" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 39.8 83.6 L 47.8 83.6 L 47.8 72.4" fill="none" stroke="#c9453f" stroke-width="1"/>
    <path d="M 52 72 L 58.5 80" fill="none" stroke="#f7f4f0" stroke-width="3" stroke-linecap="round"/>
    <path d="M 58.5 81 L 60.5 98" fill="none" stroke="#8e2b2b" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="57.3" y="80" width="2.8" height="3.8" rx="0.6" fill="#e8c34a" stroke="#6b5313" stroke-width="0.7"/>
  </g>
  <g id="p-skirt">
    <path d="M 38.5 102 L 63.5 102 L 70 126 L 33 126 Z"
          fill="#823f49" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 45 103 L 42 125.5 M 51 103 L 51.5 125.5 M 57 103 L 61 125.5"
          fill="none" stroke="#5a2830" stroke-width="1.1"/>
  </g>
</defs>
