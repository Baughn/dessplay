<!-- Osaka's furniture, drawn in the same hand as her (art/osaka.svg):
     outlines in currentColor, stroke 2 for silhouettes and thinner for
     detail, soft fills.

     Each piece is drawn in its own frame, with 20 × 42 units per cell
     (her scale at a 9 × 19 px cell), and its floor along the frame's
     bottom edge. Frames: sofa 180 × 126 (9 × 3 cells), tv 120 × 168
     (6 × 4), bed 200 × 126 (10 × 3), desk 140 × 126 (7 × 3). Pieces
     with a front and a back (bed, desk) face right, and are mirrored
     when placed facing left. -->
<defs>
  <!-- A two-seat sofa, seen from the front, with a yellow throw
       cushion on its left arm. -->
  <g id="sofa">
    <rect x="12" y="118" width="7" height="8" fill="#5b3d2a" stroke="currentColor" stroke-width="1.4"/>
    <rect x="161" y="118" width="7" height="8" fill="#5b3d2a" stroke="currentColor" stroke-width="1.4"/>
    <rect x="16" y="34" width="148" height="52" rx="12" fill="#5f8f8b" stroke="currentColor" stroke-width="2"/>
    <path d="M 90 38 L 90 80" fill="none" stroke="#3f6663" stroke-width="1.3"/>
    <rect x="8" y="80" width="164" height="40" rx="6" fill="#5f8f8b" stroke="currentColor" stroke-width="2"/>
    <rect x="22" y="74" width="68" height="16" rx="6" fill="#6fa19c" stroke="currentColor" stroke-width="1.6"/>
    <rect x="90" y="74" width="68" height="16" rx="6" fill="#6fa19c" stroke="currentColor" stroke-width="1.6"/>
    <rect x="2" y="56" width="24" height="64" rx="10" fill="#5f8f8b" stroke="currentColor" stroke-width="2"/>
    <rect x="154" y="56" width="24" height="64" rx="10" fill="#5f8f8b" stroke="currentColor" stroke-width="2"/>
    <rect x="30" y="50" width="24" height="24" rx="5" transform="rotate(-12 42 62)"
          fill="#e7c77a" stroke="currentColor" stroke-width="1.6"/>
    <path d="M 36 56 L 48 68 M 48 56 L 36 68" fill="none" stroke="#b8963f" stroke-width="1" transform="rotate(-12 42 62)"/>
  </g>

  <!-- A small CRT on a low wooden cabinet, rabbit-ear antenna on top.
       The screen is its own part (tv-screen) so channels can be drawn
       over it. Screen: 26..84 × 72..118. -->
  <g id="tv">
    <path d="M 60 62 L 36 12 M 60 62 L 88 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="36" cy="12" r="3" fill="#c9453f" stroke="currentColor" stroke-width="1.2"/>
    <circle cx="88" cy="8" r="3" fill="#c9453f" stroke="currentColor" stroke-width="1.2"/>
    <path d="M 48 64 C 48 52 72 52 72 64 Z" fill="#8c8578" stroke="currentColor" stroke-width="1.6"/>
    <rect x="12" y="130" width="96" height="32" rx="3" fill="#8a5f3c" stroke="currentColor" stroke-width="2"/>
    <path d="M 60 132 L 60 160" fill="none" stroke="#5b3d2a" stroke-width="1.3"/>
    <circle cx="54" cy="146" r="1.8" fill="#e8c34a" stroke="#5b3d2a" stroke-width="0.8"/>
    <circle cx="66" cy="146" r="1.8" fill="#e8c34a" stroke="#5b3d2a" stroke-width="0.8"/>
    <rect x="16" y="160" width="8" height="6" fill="#5b3d2a" stroke="currentColor" stroke-width="1.2"/>
    <rect x="96" y="160" width="8" height="6" fill="#5b3d2a" stroke="currentColor" stroke-width="1.2"/>
    <rect x="18" y="62" width="86" height="66" rx="9" fill="#cbbfa8" stroke="currentColor" stroke-width="2"/>
    <circle cx="94" cy="80" r="4" fill="#8c8578" stroke="currentColor" stroke-width="1.2"/>
    <circle cx="94" cy="94" r="4" fill="#8c8578" stroke="currentColor" stroke-width="1.2"/>
    <path d="M 90 106 L 98 106 M 90 110 L 98 110 M 90 114 L 98 114" fill="none" stroke="#8c8578" stroke-width="1"/>
  </g>
  <g id="tv-screen">
    <rect x="26" y="72" width="58" height="46" rx="8" fill="#2b3440" stroke="currentColor" stroke-width="1.6"/>
    <path d="M 32 80 C 38 76 46 75 52 76" fill="none" stroke="#6b7a8c" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- A single bed seen from the side: headboard on the left, a pillow,
       a blue polka-dot quilt folded back at the head. -->
  <g id="bed">
    <rect x="4" y="44" width="16" height="82" rx="6" fill="#9a7350" stroke="currentColor" stroke-width="2"/>
    <rect x="182" y="76" width="14" height="50" rx="5" fill="#9a7350" stroke="currentColor" stroke-width="2"/>
    <rect x="10" y="98" width="182" height="14" fill="#9a7350" stroke="currentColor" stroke-width="2"/>
    <rect x="30" y="112" width="7" height="14" fill="#7a5a3e" stroke="currentColor" stroke-width="1.4"/>
    <rect x="164" y="112" width="7" height="14" fill="#7a5a3e" stroke="currentColor" stroke-width="1.4"/>
    <rect x="20" y="80" width="162" height="18" rx="4" fill="#f0ede4" stroke="currentColor" stroke-width="1.8"/>
    <ellipse cx="42" cy="76" rx="18" ry="8" fill="#f7f4f0" stroke="currentColor" stroke-width="1.6"/>
    <path d="M 70 78 C 100 74 150 74 182 78 L 184 104 C 150 108 100 108 72 104 Z"
          fill="#8fb3d9" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 70 78 C 64 84 64 98 72 104" fill="#b7cfe8" stroke="currentColor" stroke-width="1.6"/>
    <g fill="#f7f4f0">
      <circle cx="92" cy="86" r="2.2"/><circle cx="112" cy="94" r="2.2"/>
      <circle cx="132" cy="84" r="2.2"/><circle cx="152" cy="94" r="2.2"/>
      <circle cx="170" cy="86" r="2.2"/><circle cx="100" cy="99" r="2"/>
      <circle cx="142" cy="100" r="2"/>
    </g>
  </g>

  <!-- A study desk seen from the side, its front to the right: a lamp,
       a stack of books, a pencil cup, a drawer. She sits on its right. -->
  <g id="desk">
    <rect x="10" y="68" width="7" height="58" fill="#8a5f3c" stroke="currentColor" stroke-width="1.6"/>
    <rect x="118" y="68" width="7" height="58" fill="#8a5f3c" stroke="currentColor" stroke-width="1.6"/>
    <rect x="78" y="68" width="46" height="22" fill="#a0784f" stroke="currentColor" stroke-width="1.8"/>
    <rect x="96" y="77" width="10" height="3" rx="1.5" fill="#e8c34a" stroke="#5b3d2a" stroke-width="0.8"/>
    <rect x="4" y="60" width="130" height="9" rx="2" fill="#a0784f" stroke="currentColor" stroke-width="2"/>
    <rect x="16" y="50" width="34" height="10" rx="1" fill="#c9453f" stroke="currentColor" stroke-width="1.4"/>
    <rect x="19" y="41" width="30" height="9" rx="1" fill="#5f8f8b" stroke="currentColor" stroke-width="1.4"/>
    <rect x="17" y="33" width="28" height="8" rx="1" fill="#e7c77a" stroke="currentColor" stroke-width="1.4"/>
    <path d="M 60 44 L 62 60 L 72 60 L 74 44 Z" fill="#e07f7a" stroke="currentColor" stroke-width="1.4"/>
    <path d="M 64 44 L 62 32 M 68 44 L 69 30 M 71 44 L 75 34" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <ellipse cx="110" cy="58" rx="10" ry="3" fill="#6b7a8c" stroke="currentColor" stroke-width="1.4"/>
    <path d="M 110 56 L 104 30 L 118 14" fill="none" stroke="#6b7a8c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 110 6 L 128 12 L 124 28 L 106 22 Z" fill="#e8c34a" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
</defs>
