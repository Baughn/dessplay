[package]
name = "dessplay"
version.workspace = true
edition.workspace = true

[features]
# Real-mpv integration tests (require an `mpv` binary; they use lavfi
# synthetic sources, so no media files are needed).
mpv-tests = []

[dependencies]
dessplay-core = { path = "../dessplay-core" }
color-eyre = { workspace = true }
clap = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
csv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The commentary engine's private screenshot directory (a predictable
# path in the shared $TMPDIR was a symlink-following hazard).
tempfile = { workspace = true }
tuirealm = { workspace = true }
crossterm = { workspace = true }
palette = { workspace = true }
unicode-width = { workspace = true }
image = { workspace = true }
ab_glyph = { workspace = true }
strsim = { workspace = true }
chrono = { workspace = true }
# Nyaa browse import: nyaa.si RSS search (blocking GET on the
# blocking pool, same pattern as the server's titles-dump fetch).
ureq = { workspace = true }
quick-xml = { workspace = true }
percent-encoding = { workspace = true }
librqbit = { version = "8.1.1", default-features = false, features = ["rust-tls"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
mimalloc = { workspace = true }
rlimit = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
dessplay-core = { path = "../dessplay-core", features = ["test-support"] }
