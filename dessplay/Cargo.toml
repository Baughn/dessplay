[package]
name = "dessplay"
version.workspace = true
edition.workspace = true

[features]
# Real-mpv integration tests (require an `mpv` binary; they use lavfi
# synthetic sources, so no media files are needed).
mpv-tests = []

[dependencies]
dessplay-core = { path = "../dessplay-core" }
color-eyre = { workspace = true }
clap = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
csv = { workspace = true }
serde_json = { workspace = true }
tuirealm = { workspace = true }
crossterm = { workspace = true }
tui-realm-stdlib = { workspace = true }
image = { workspace = true }
ab_glyph = { workspace = true }
strsim = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
dessplay-core = { path = "../dessplay-core", features = ["test-support"] }
