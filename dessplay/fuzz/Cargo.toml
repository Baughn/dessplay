[package]
name = "dessplay-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Excluded from the root workspace (fuzz builds use their own profile).
[workspace]

# The root workspace's [patch.crates-io] does not reach this one; mirror
# it (see the root Cargo.toml for why each patch exists). Kept in step by
# dessplay-core/tests/fuzz_manifests.rs.
[patch.crates-io]
quinn-udp = { path = "../../vendor/quinn-udp" }
crdts = { path = "../../vendor/crdts" }

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
tempfile = "3"
serde_json = "1"
dessplay-core = { path = "../../dessplay-core" }
dessplay = { path = ".." }

[[bin]]
name = "mpv_ipc_translate"
path = "fuzz_targets/mpv_ipc_translate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mpv_ass_text"
path = "fuzz_targets/mpv_ass_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "download_scheduler"
path = "fuzz_targets/download_scheduler.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roguelike"
path = "fuzz_targets/roguelike.rs"
test = false
doc = false
bench = false
