[package]
name = "dessplay-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
postcard = { workspace = true }
crdts = { workspace = true }
md4 = { workspace = true }
digest = { workspace = true }
sha2 = { workspace = true }
rustc-hash = { workspace = true }
tokio = { workspace = true }
quinn = { workspace = true }
socket2 = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
tracing = { workspace = true }
arbitrary = { version = "1", features = ["derive"], optional = true }
rand = { workspace = true, optional = true }

[features]
# Structured-input generators and the SimulatedTransport, shared by the
# proptest suites, fuzz targets, and the multi-client harness.
test-support = ["dep:arbitrary", "dep:rand"]

[dev-dependencies]
# Reference implementation to cross-check our md4-based ed2k hashing.
ed2k = { workspace = true }
proptest = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
dessplay-core = { path = ".", features = ["test-support"] }
# Wire-level DSCP regression test (tests/dscp_wire.rs): drives quinn's
# UDP layer directly and reads the TOS byte back with raw recvmsg.
quinn-udp = "0.5"
libc = "0.2"
