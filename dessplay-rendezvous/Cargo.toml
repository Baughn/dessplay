[package]
name = "dessplay-rendezvous"
version.workspace = true
edition.workspace = true

[dependencies]
dessplay-core = { path = "../dessplay-core" }
color-eyre = { workspace = true }
clap = { workspace = true }
rusqlite = { workspace = true }
# Transfer-connection binding tokens (AuthOk / TransferAuth).
rand = { workspace = true }
tokio = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ureq = { workspace = true }
flate2 = { workspace = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
mimalloc = { workspace = true }
rlimit = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
dessplay-core = { path = "../dessplay-core", features = ["test-support"] }
# The connection tests drive the real client NetworkActor against this
# server, in-process.
dessplay = { path = "../dessplay" }
tuirealm = { workspace = true }
