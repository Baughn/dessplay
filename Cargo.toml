[workspace]
resolver = "3"
members = ["dessplay-core", "dessplay", "dessplay-rendezvous"]
# vendor/quinn-udp is a patched dependency, not a workspace crate — kept
# out so workspace-wide fmt/clippy/test leave upstream's code style alone.
exclude = ["dessplay-core/fuzz", "dessplay/fuzz", "vendor/quinn-udp"]

# quinn-udp attaches a per-packet IP_TOS/IPV6_TCLASS cmsg carrying only
# the ECN bits, which overrides — and so zeroes — the socket-level DSCP
# set in net/quic.rs::bind_socket. Upstream declined to add DSCP support
# (quinn-rs/quinn#1749), so this fork captures the socket's TOS byte at
# UdpSocketState creation and ORs it into the cmsg. Regression test:
# dessplay-core/tests/dscp_wire.rs. Patch sites marked "DESSPLAY PATCH"
# in vendor/quinn-udp/src/unix.rs.
[patch.crates-io]
quinn-udp = { path = "vendor/quinn-udp" }

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
crdts = "7.3"
tokio = { version = "1", features = ["full"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
# DSCP tagging: quinn exposes no per-transmit DSCP (ECN only), so sockets
# are built and tagged by us before handing them to the endpoint.
socket2 = { version = "0.6", features = ["all"] }
# tls12 is enabled for the IRC bridge: QUIC always negotiates TLS 1.3, but
# a public IRC server we don't control may only offer 1.2. Harmless for QUIC.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# IRC bridge: plain-TCP TLS over the same pinned rustls (no native-tls).
# webpki-roots is already in the tree via ureq, so it adds no new weight.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rcgen = "0.13"
sha2 = "0.10"
color-eyre = "0.6"
proptest = "1"
csv = "1.4"
tuirealm = "4"
crossterm = "0.29"
palette = { version = "0.7", default-features = false, features = ["std"] }
# Terminal display width (CJK-aware) for the UI's aligned columns —
# char counts under-pad wide glyphs. Already in the tree via ratatui, so
# a direct dep adds no weight.
unicode-width = "0.2"
insta = "1.47"
rand = "0.9"
# Encoding the commentary screenshot into an Anthropic image block;
# already in the tree transitively via librqbit's reqwest.
base64 = "0.22"
ed2k = "1.0"
md4 = "0.10"
digest = "0.10"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
rusqlite = { version = "0.34", features = ["bundled"] }
dirs = "6"
tempfile = "3"
# Server-side anime-titles dump fetch (one blocking GET per day); the
# client reuses it for the nyaa.si RSS search (torrent-first downloads).
ureq = "3"
flate2 = "1"
# Nyaa RSS parsing — titles arrive entity-escaped, and hand-rolled XML
# entity handling is a bug farm.
quick-xml = "0.37"
# Building the nyaa search URL (query = an exact release filename).
percent-encoding = "2"
# Placeholder PNG generation (Phase 9): rasterize status text with the
# embedded DejaVu Sans into a PNG mpv can display.
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
# Manual-mapping browser: candidate files sorted by edit distance.
strsim = "0.11"
# Fast non-cryptographic hasher for the franchise-cache input fingerprint
# (hashed every UI snapshot; SipHash showed up as ~450ms in profiling).
rustc-hash = "2"
# Local-time conversion for chat timestamps (reliable in multithreaded
# apps, unlike the `time` crate's current_local_offset).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Global allocator for both binaries (Linux/macOS only -- mimalloc doesn't
# support Windows/MSVC well here either, and isn't needed there). glibc
# malloc doesn't return freed memory to the OS after a burst of small
# allocations (e.g. a large library scan); mimalloc purges freed pages
# back to the OS on its own. (jemalloc was tried first but its configure
# script fails under NixOS's default hardening flags -- mimalloc builds
# clean with no workarounds.)
mimalloc = "0.1"
# Raise RLIMIT_NOFILE at startup in both binaries: launchd's soft
# default is 256 fds and librqbit holds up to 128 peer sockets per
# torrent (os error 24 storms, 2026-07-09). The crate handles the macOS
# kern.maxfilesperproc cap that a naive setrlimit(RLIM_INFINITY) trips.
rlimit = "0.10"
# System clipboard for chat drag-selection copy (macOS NSPasteboard /
# X11/Wayland). Local-machine only; over SSH the copy silently degrades.
arboard = { version = "3", default-features = false }

# The nix (rust-overlay) nightly's bundled rust-objcopy has a broken
# libLLVM.dylib rpath on macOS (@loader_path/../lib, but the dylib is
# in the toolchain's top-level lib/), so any unit built with cargo's
# implied strip = "debuginfo" warns "stripping debug info with
# `rust-objcopy` failed: SIGABRT". Cargo implies that strip wherever
# `debug` is off: the release default, and every dependency unit under
# the dev `package."*"` override below -- including dependency build
# scripts and proc macros, which are linked and therefore stripped.
# The implied strip is applied per override layer, so a base-profile
# strip = false is NOT inherited by an override that sets debug = false;
# every layer that turns debug off must say strip = false itself.
# Nothing is lost: units with debug off have no debuginfo to strip, and
# the release binary keeps symbols for samply profiling (on macOS debug
# info lives in the object files, so the size cost is small).
[profile.release]
strip = false
[profile.release.build-override]
strip = false
[profile.dev.build-override]
strip = false

# Dependencies compile once and are never stepped through incrementally;
# their full DWARF was the bulk of a 50GB target/. Workspace crates keep
# full debug info. Dep backtraces keep function names, lose line numbers.
[profile.dev.package."*"]
debug = false
strip = false  # see the rust-objcopy note above

# Debug-build MD4 hashes at ~70 MiB/s — a 1.4GB episode takes 20s and
# feels broken (release: >1.2 GiB/s). Always optimize the hash inner
# loops; debug info elsewhere is unaffected.
[profile.dev.package.md4]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3
[profile.dev.package.typenum]
opt-level = 3
