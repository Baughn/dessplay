[workspace]
resolver = "3"
members = ["dessplay-core", "dessplay", "dessplay-rendezvous"]
exclude = ["dessplay-core/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
crdts = "7.3"
tokio = { version = "1", features = ["full"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
sha2 = "0.10"
color-eyre = "0.6"
proptest = "1"
csv = "1.4"
tuirealm = "4"
crossterm = "0.29"
tui-realm-stdlib = "4"
insta = "1.47"
rand = "0.9"
ed2k = "1.0"
md4 = "0.10"
digest = "0.10"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
rusqlite = { version = "0.34", features = ["bundled"] }
dirs = "6"
tempfile = "3"
# Server-side anime-titles dump fetch (one blocking GET per day).
ureq = "3"
flate2 = "1"

# Debug-build MD4 hashes at ~70 MiB/s — a 1.4GB episode takes 20s and
# feels broken (release: >1.2 GiB/s). Always optimize the hash inner
# loops; debug info elsewhere is unaffected.
[profile.dev.package.md4]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3
[profile.dev.package.typenum]
opt-level = 3
