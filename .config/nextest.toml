# Nextest configuration. The default profile is the stop-hook / dev gate;
# `--profile full` (or --ignore-default-filter) runs everything.

[profile.default]
# The perf.rs wall-clock regression tests sample real CPU/latency over 3s+
# windows and only *assert* in release builds (debug just prints) — in the
# debug gate they cost ~4s and verify nothing. Run them explicitly with:
#   cargo nextest run --profile full [--release]
default-filter = "not binary(perf)"
# No test legitimately takes >30s (paused-time tokio; worst real-time test
# ~4s): flag anything slower as SLOW — usually an accidental real sleep —
# and kill it at 60s so the blocking gate is bounded.
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.full]
# Everything, including the perf regression tests.
default-filter = "all()"
slow-timeout = { period = "60s", terminate-after = 2 }

# Explicit partial gate for environments that deny local sockets. The default
# profile still runs real QUIC/UDP coverage; run it with socket access before
# merging. Protocol-only mpv tests and native layout watchers run in both.
[profile.sandbox]
default-filter = """
not (binary(perf)
    | test(net::quic::socket_tests::)
    | binary(dscp_wire)
    | binary(quic_localhost)
    | binary(mpv_real)
    | binary(live_rqbit)
    | test(=player::mpv::tests::a_slow_mpv_startup_is_not_a_crash)
    | test(=torrent::rqbit::tests::session_starts_without_persistence))
"""
