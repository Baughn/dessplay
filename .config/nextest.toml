# Nextest configuration. The default profile is the stop-hook / dev gate;
# `--profile full` (or --ignore-default-filter) includes perf tests.
# `--profile band` gives the houseguest's full-strength stillness band minutes a test.
# Ignored OS/socket tests still require explicit --run-ignored selection.

[profile.default]
# The perf.rs wall-clock regression tests sample real CPU/latency over 3s+
# windows and only *assert* in release builds (debug just prints) — in the
# debug gate they cost ~4s and verify nothing. Run them explicitly with:
#   cargo nextest run --profile full [--release]
default-filter = "not binary(perf)"
# No test legitimately takes >30s (paused-time tokio; worst real-time test
# ~4s): flag anything slower as SLOW — usually an accidental real sleep —
# and kill it at 60s so the blocking gate is bounded. The exceptions are
# overridden below, by name, each with its reason.
slow-timeout = { period = "30s", terminate-after = 2 }

# The houseguest's made-piece property simulates a 1.5-minute-plus visit
# per case: ~13 s at the gate's 32 cases, but ~50 s at the deep pass's
# 256 (PROPTEST_CASES=256, release), which a loaded machine pushed past
# the 60 s kill. Kill it at 120 s instead.
[[profile.default.overrides]]
filter = 'test(every_made_piece_is_used_or_let_go)'
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.full]
# Include perf regression tests; ignored tests still need --run-ignored.
default-filter = "all()"
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.band]
# The houseguest's stillness band at full strength (tests/band.rs:
# CENSUS_BAND_SEEDS=<n> --release --run-ignored all): minutes a test, at
# the largest N a band or spread line prints. Kill at 20 min. Under the
# per-mood rule a stage cell aimed just over its floor may need thousands
# of visits (phase5c/baseline.md, step 8b: N ~ 6800 for one), which no
# run finishes inside this limit. At the gate's seeds the band tests run
# about 3 s and keep the default 60 s.
slow-timeout = { period = "300s", terminate-after = 4 }
